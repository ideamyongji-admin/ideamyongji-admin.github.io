<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>라운지 예약 관리 | IDEA 사업단</title>
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .roster-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--bg-soft-2); font-size:13px; margin:4px; }
  .roster-chip button { border:0; background:none; color:#d92d20; cursor:pointer; font-size:14px; line-height:1; padding:0; }
</style>
</head>
<body>

<div class="admin-bar">
  <div class="container">
    <div class="brand-mini">
      <img src="assets/img/logo-mark.png" alt="IDEA 사업단">
      라운지 예약 관리
    </div>
    <div style="display:flex; align-items:center; gap:18px;">
      <button id="logout-btn" type="button" class="back" style="background:none; border:0; font:inherit; cursor:pointer;" hidden>로그아웃</button>
      <a href="reserve.html" class="back">← 라운지 예약으로 돌아가기</a>
    </div>
  </div>
</div>

<section class="section--tight">
  <div class="container">

    <div class="section-head" style="margin-bottom:32px;">
      <span class="eyebrow"><span class="dot"></span>ADMIN</span>
      <h2>IDEA 라운지 예약 관리</h2>
      <p>마이크로디그리 참여 학생 명단을 등록하고, 전체 예약 현황을 확인·취소할 수 있습니다.</p>
    </div>

    <div id="login-panel" class="card" style="max-width:440px; margin: 0 auto 32px;">
      <h3 style="font-size:16px; margin-bottom:8px;">관리자 Google 계정으로 로그인</h3>
      <div id="login-status" class="status-msg"></div>
      <button id="google-login-btn" type="button" class="btn btn--primary">Google 계정으로 로그인</button>
    </div>

    <div id="denied-panel" class="card" style="max-width:440px; margin: 0 auto 32px;" hidden>
      <p style="color:#d92d20;">관리자 권한이 없는 계정입니다. (<span id="denied-email"></span>)</p>
    </div>

    <div id="admin-content" hidden>

      <div class="grid grid--2" style="align-items:start; margin-bottom:48px;">
        <div class="card">
          <h3 style="font-size:16px; margin-bottom:8px;">마이크로디그리 명단 일괄 등록</h3>
          <p style="font-size:13.5px; color:var(--ink-500); margin-bottom:16px;">
            학번을 한 줄에 하나씩(또는 쉼표로 구분) 붙여넣고 등록하세요. 이미 등록된 학번은 건너뜁니다.
          </p>
          <div id="roster-status" class="status-msg"></div>
          <form id="roster-form">
            <div class="field">
              <label for="roster-textarea">학번 목록</label>
              <textarea id="roster-textarea" rows="8" placeholder="20231234&#10;20231235&#10;20231236"></textarea>
            </div>
            <button type="submit" class="btn btn--primary">일괄 등록</button>
          </form>
        </div>

        <div class="card">
          <h3 style="font-size:16px; margin-bottom:8px;">등록된 명단 (<span id="roster-count">0</span>명)</h3>
          <div id="roster-list" style="margin-top:12px;"></div>
        </div>
      </div>

      <div class="section-head" style="margin-bottom:24px;">
        <span class="eyebrow"><span class="dot"></span>예약 현황</span>
        <h2>전체 예약 관리</h2>
      </div>
      <div class="field" style="max-width:220px; margin-bottom:20px;">
        <label for="admin-date">조회 날짜</label>
        <input type="date" id="admin-date">
      </div>
      <div id="admin-reservations-list" class="card"></div>

    </div>

  </div>
</section>

<script type="module" src="assets/js/reserve-admin.js"></script>
</body>
</html>
